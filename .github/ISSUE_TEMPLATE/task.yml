name: "Technical Task & Maintenance"
description: "Expo updates, React Native upgrades, build configs, native modules"
title: "[TASK]: "
labels: ["technical", "mobile"]
body:
  - type: dropdown
    id: task_category
    attributes:
      label: "Task Category"
      options:
        - "Expo / React Native Upgrade"
        - "EAS Build / Deployment Configuration"
        - "Performance & Animation Optimization"
        - "Native Module Integration"
        - "Testing (Jest / Detox)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Task Description"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria"
      placeholder: |
        - [ ] Builds successfully on EAS (iOS & Android)
        - [ ] App launches without errors on physical device
    validations:
      required: true