name: "Bug Report"
description: "Report a mobile app crash, native bug, or screen glitch"
title: "[BUG]: "
labels: ["bug", "mobile"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      placeholder: "Describe the issue happening on the mobile application..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      placeholder: |
        1. Open app
        2. Tap on 'Timeline'
        3. App crashes on splash screen
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: "Target Platform"
      options:
        - "Both (iOS & Android)"
        - "iOS Only"
        - "Android Only"
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: "Device / Emulator Info"
      placeholder: "e.g., iPhone 15 iOS 17.2 / Samsung S23 Android 14 / Expo Go v51"

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Console Logs / Expo RedBox Error"
      render: shell

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - "P0 - Crash on launch / Blocker"
        - "P1 - Feature unusable"
        - "P2 - UI glitch / Workaround exists"
        - "P3 - Minor visual bug"
    validations:
      required: true